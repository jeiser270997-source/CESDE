<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Barbería</title>
  </head>
  <body>
    <!-- 1. Encabezado con Banner y Navegación -->
    <header>
      <img src="imagen/banner.png" alt="" />
      <nav>
        <a>Inicio</a>
        <a>Contacto</a>
        <a>Productos</a>
        <a>Sobre Nosotros</a>
      </nav>
    </header>

    <!-- 2. Contenido Principal: Tabla de Servicios (4 filas x 3 columnas) -->
    <main>
      <section>
        <table>
          <!-- Fila 1: Encabezados -->
          <tr>
            <th>Descripción</th>
            <th>Video</th>
            <th>Imagen</th>
          </tr>
          <!-- Fila 2: Corte Clásico -->
          <tr>
            <td></td>
            <td>
              <video src="video/receta_churro.mp4" controls width="300"></video>
            </td>
            <td>
              <img src="imagen/corte.jpg" alt="" width="200" />
            </td>
          </tr>
          <!-- Fila 3: Perfilado de Barba -->
          <tr>
            <td></td>
            <td>
              <video src="video/receta_churro.mp4" controls width="300"></video>
            </td>
            <td>
              <img src="imagen/barba.jpg" alt="" width="200" />
            </td>
          </tr>
          <!-- Fila 4: Afeitado Tradicional -->
          <tr>
            <td></td>
            <td>
              <video src="video/receta_churro.mp4" controls width="300"></video>
            </td>
            <td>
              <img src="imagen/afeitado.jpg" alt="" width="200" />
            </td>
          </tr>
        </table>
      </section>
    </main>
  </body>
</html>
